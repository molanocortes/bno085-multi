sentence=Reentrant BNO085 driver: run several BNO08x IMUs on one MCU simultaneously.
paragraph=Single-header, dependency-free SHTP driver for the BNO085/BNO086/BNO080 rotation vector. Keeps all protocol state per instance (no globals), so multiple sensors stream at full rate, unlike the single-instance Adafruit_BNO08x library. Tested on Teensy 4.1 with two IMUs at 50 Hz.
